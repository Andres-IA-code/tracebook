appId: pentest-reports-desktop
productName: "Tracebook"
directories:
  output: release
  buildResources: public/icons
files:
  - electron/**
  - dist-desktop/**
  - public/icons/**
  - package.json
asar: true
win:
  icon: public/icons/icon-512.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "Tracebook-${version}-win-${arch}-setup.${ext}"
portable:
  artifactName: "Tracebook-${version}-win-${arch}-portable.${ext}"
mac:
  icon: public/icons/icon-512.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  icon: public/icons/icon-512.png
  category: Development
  syncDesktopName: true
  maintainer: "Andrés Consiglio (Tracebook)"
  target: [AppImage, deb]
artifactName: "Tracebook-${version}-${os}-${arch}.${ext}"
