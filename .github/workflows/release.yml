name: Publicar versión

# Genera los instaladores de Windows, macOS y Linux, calcula sus huellas SHA-256
# y crea un borrador de Release en GitHub para revisarlo antes de publicarlo.
# Se ejecuta a mano (pestaña Actions → "Publicar versión" → Run workflow)
# o al subir una etiqueta del tipo v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    name: Leer versión
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Determinar etiqueta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no coincide con la versión de package.json (${VERSION})."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Versión a publicar: ${TAG}"

  build:
    name: Instaladores (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: --linux
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
      - name: Usar el registro público de npm
        run: node scripts/fix-lockfile.mjs
      - name: Instalar dependencias
        run: bun install
      - name: Compilar la app de escritorio
        run: bun run build:desktop
      - name: Generar instaladores
        run: bunx electron-builder ${{ matrix.target }} --publish never
      - name: Guardar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb

  release:
    name: Crear borrador de Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Calcular huellas SHA-256
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Crear borrador de Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Tracebook ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: dist/*
          body: |
            ## Descargas
            - **Windows:** `-setup.exe` (instalador) o `-portable.exe` (sin instalación).
            - **macOS:** `.dmg` — `arm64` para Apple Silicon, `x64` para Intel.
            - **Linux:** `.AppImage` o `.deb`.

            Los instaladores no están firmados: revisa en el README cómo abrirlos la primera vez.
            Verifica cada archivo con las huellas de `SHA256SUMS.txt`.
